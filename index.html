<style>
:root{
  color-scheme:light;
  --paper:#f4f6f9; --panel:#ffffff; --ink:#111a24; --mute:#4a5868; --line:#c9d2dc;
  --accent:#1a56b8; --accent-ink:#ffffff;
  --new:#a8650a; --acc:#1a56b8; --ret:#b42318; --done:#1b7a45;
  --danger:#b42318; --urg:#d9480f; --org:#e8710a; --org-ink:#fff;
  --eg-ink:#0b4a8f; --eg-bg:#e3effd; --eg-line:#9cc2f2;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11161c; --panel:#1a212a; --ink:#e6ebf0; --mute:#93a1af; --line:#2c3642;
  --accent:#5b97ee; --accent-ink:#0b1626; --new:#e0a64a; --acc:#5b97ee; --ret:#ef7d73; --done:#5cc487; --danger:#ef7d73; --urg:#ff9a62; --org:#f59e42; --org-ink:#1f1303;
  --eg-ink:#a9cdfa; --eg-bg:#1b2d45; --eg-line:#2f4f7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-prefs{position:fixed;top:12px;inset-inline-end:12px}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:380px}
.login-box h1{margin:0 0 4px;font-size:22px;font-weight:600}
.login-box p{margin:0 0 18px;color:var(--mute)}

/* shell */
.prefs{display:flex;gap:6px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{margin:0;font-size:18px;font-weight:600}
header.top .sp{flex:1}
header.top .who{color:var(--mute);font-size:13px}
main{display:flex;flex-direction:column;gap:16px;padding:20px;max-width:1400px;margin:0 auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.form{padding:18px}
#formDlg{width:min(520px,94vw)}#formDlg .form{border:0;border-radius:0;width:100%;overflow:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:none}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.kpi.s-all{--c:var(--mute)}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:10px;padding:12px;text-align:start;cursor:pointer}
.kpi:hover{border-color:var(--c)}.kpi.on{background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.kpi b{display:block;font-size:28px;line-height:1.1;font-weight:600;color:var(--c,var(--ink))}.kpi span{font-size:13px;color:var(--mute)}
.kpi.k-od{--c:var(--ret)}
.kpi.s-urg{--c:var(--urg)}
.case.urgent{border-color:var(--urg);box-shadow:0 0 0 1px var(--urg)}
.ub{display:inline-block;font-size:12px;font-weight:700;line-height:1.6;padding:0 9px;border-radius:999px;color:#fff;background:var(--urg);white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;margin:14px 0 0;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;padding:0;flex:none;accent-color:var(--urg)}
.pc-urg{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--urg);font-weight:600;cursor:pointer}
.pc-urg input{width:16px;height:16px;padding:0;accent-color:var(--urg)}
.screen{display:flex;flex-direction:column;gap:16px}
.nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:10px 18px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.nav button:hover{color:var(--ink)}
.nav button[aria-pressed=true]{color:var(--accent);border-bottom-color:var(--accent)}
#actBody{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.act-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act-tools input{width:auto}.btn.green{background:var(--done);border-color:var(--done);color:var(--accent-ink);font-weight:600}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.orange{background:var(--org);border-color:var(--org);color:var(--org-ink);font-weight:600}
.btn.green:hover,.btn.blue:hover,.btn.orange:hover{filter:brightness(1.08)}
.mailbox{display:inline-flex;align-items:stretch;border:2px solid var(--accent);border-radius:8px;overflow:hidden}
.act-tools .mailbox input{width:240px;border:0;border-radius:0;margin:0;background:var(--panel)}
.act-tools .mailbox input:focus-visible{outline-offset:-2px}
.mailbox .btn{border:0;border-radius:0}.act-tools .sp{flex:1}
.act-govs{color:var(--mute);font-size:13px}
.act-sec{border:1px solid var(--line);border-radius:8px;padding:12px}
.act-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.act-head .sp{flex:1}
.act-wrap{overflow-x:auto;direction:ltr}
.act-t{direction:ltr;border-collapse:collapse;font-size:13px;min-width:1250px;width:100%}
.act-t th,.act-t td{border:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.act-t th{color:#000;font-weight:700;white-space:normal;min-width:80px}
.act-t th.b{background:#8EA9DB}.act-t th.y{background:#FFFF00}.act-t th.r{background:#FF0000;color:#fff}
.act-t td.nt{color:var(--mute)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.odb{grid-column:1/-1;color:var(--ret);border:1px solid var(--ret);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ret);margin-inline-end:6px}
.case.od{border-color:var(--ret)}
#refreshBtn{min-width:130px}
.btn.loading{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);pointer-events:none}
.dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dt 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.form h2,.board h2{margin:0 0 14px;font-size:16px;font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
.hint{font-size:13px;margin-top:6px;min-height:20px}
.hint.ok{color:var(--done)} .hint.bad{color:var(--danger)}
.row-btns{display:flex;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;flex:1}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.editing{background:color-mix(in srgb,var(--new) 14%,transparent);border:1px solid var(--new);border-radius:6px;padding:8px 11px;font-size:13px;margin-bottom:4px}

/* board */
.board{padding:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab b{font-weight:600;margin-inline-start:4px}
.search{max-width:200px}
.tools .search{flex:1 1 160px;max-width:260px}
.tools select{width:auto;min-width:140px;padding:7px 10px;font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:10px}
@media (max-width:520px){.list{grid-template-columns:1fr}}
.case{border:1px solid var(--line);border-radius:8px;border-inline-start:4px solid var(--c,var(--line));padding:11px 14px;cursor:pointer;align-self:start}
.case.open{grid-column:1/-1}
.case{background:color-mix(in srgb,var(--c,transparent) 5%,var(--panel))}
.case:hover{background:color-mix(in srgb,var(--c,var(--ink)) 11%,var(--panel))}
:root[data-theme="light"] .panel{box-shadow:0 1px 2px rgba(17,26,36,.06)}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#fff;border-color:#b9c4d0}
:root[data-theme="light"] .badge{background:color-mix(in srgb,var(--c) 10%,#fff)}
.case .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case .hd .sp{flex:1}
.case .tk{font-weight:600;font-size:16px;direction:ltr;unicode-bidi:isolate}
.case .hd .eg,.case .hd .dp{margin:0}
.case .sub{display:flex;align-items:baseline;gap:8px;margin-top:4px;font-size:13px;color:var(--mute);min-width:0}
.case .gv{color:var(--mute);font-size:13px;flex:none}
.case .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink)}
.case .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--mute)}
.case .mi{white-space:nowrap}
.case .who2{font-size:13px;color:var(--mute)}
.badge{font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:1px 8px;white-space:nowrap}
.age{padding:1px 10px;border-radius:999px;color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 12%,transparent)}
.age .age-v{font-weight:600;font-variant-numeric:tabular-nums}
.age.late{color:var(--ret);background:color-mix(in srgb,var(--ret) 12%,transparent)}
.fbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.fbar .tabs{flex:none}
.fsel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fsel select{width:auto;min-width:150px;padding:5px 9px;font-size:13px}
.case .extra{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.case.open .extra{display:block}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;overflow-wrap:anywhere}
.reason{color:var(--ret);margin-top:6px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px}
.empty{grid-column:1/-1;padding:36px 10px;text-align:center;color:var(--mute)}
.s-new{--c:var(--new)} .s-acc{--c:var(--acc)} .s-ret{--c:var(--ret)} .s-done{--c:var(--done)}
@media (max-width:600px){.case .meta{gap:6px 12px}}

.form-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.form-head h2{margin:0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(860px,94vw);max-height:92vh;overflow:hidden}
dialog[open]{display:flex}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;width:100%;max-height:92vh}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:17px;font-weight:600}
.dlg-body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.step-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.step-t .n,.foot-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;flex:none}
.step-t .sum{margin-inline-start:auto;font-weight:400;font-size:13px;color:var(--mute)}
.step-d{color:var(--mute);font-size:13px;margin:2px 0 8px}
.dlg textarea{min-height:96px;font-family:Consolas,monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre}
.pv-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pv-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.pv-empty{border:1px dashed var(--line);border-radius:8px;padding:26px 10px;text-align:center;color:var(--mute);font-size:14px}
.pc{border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));border-radius:8px;padding:10px 12px;display:grid;gap:10px}
.pc.off{opacity:.55}
.pc.r-ok{--c:var(--done)} .pc.r-none{--c:var(--new)} .pc.r-dup{--c:var(--danger)}
.pc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc-top input[type=checkbox]{width:18px;height:18px;flex:none;padding:0}
.pc-tk{font-weight:600;direction:ltr;unicode-bidi:plaintext}
.pc-sp{flex:1}
.eg{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:0 9px;margin-inline-start:6px;border-radius:999px;color:var(--eg-ink);background:var(--eg-bg);border:1px solid var(--eg-line);vertical-align:middle;white-space:nowrap}
.dp{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:0 9px;margin-inline-start:6px;border-radius:999px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--accent);vertical-align:middle;white-space:nowrap}
.chip{font-size:12px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--done);border-color:var(--done)} .chip.bad{color:var(--danger);border-color:var(--danger)} .chip.warn{color:var(--new);border-color:var(--new)}
.pc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc-fields .pc-addr{grid-column:1/-1}
.pc-fields label{margin:0 0 3px;font-size:12px}
.pc-fields input{padding:6px 9px}
.pc-fields select{padding:6px 9px}
.pc-fields input.miss,.pc-fields select.miss{border-color:var(--danger)}
.pv-tools select{width:auto;max-width:240px;padding:4px 8px;font-size:13px}
.pc-nums{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
.pc-nums b{color:var(--mute);font-weight:500;margin-inline-end:5px}
@media (max-width:600px){.pc-fields{grid-template-columns:1fr}}
.dlg-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}
.dlg-foot label{margin:0;color:var(--ink);font-size:14px}
.dlg-foot select{width:auto;flex:1;min-width:160px;max-width:300px}
.kv dd{white-space:pre-line}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:80vw;z-index:20}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px}
#offBar{background:var(--danger);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px}
.rp-t{width:100%;border-collapse:collapse;font-size:14px}.rp-t th,.rp-t td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.rp-t th{background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-weight:600}.rp-t td:first-child{text-align:start;font-weight:600}
.rp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.rp-h3{margin:16px 0 8px;font-size:15px;font-weight:600}
/* ===== تصميم v2: انسيابية وترابط ===== */
:root{--r:14px;--sh:0 1px 2px rgba(10,20,35,.06),0 8px 22px -10px rgba(10,20,35,.16)}
:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.6)}
body{background:radial-gradient(1100px 480px at 85% -8%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%),var(--paper);background-attachment:fixed}
header.top{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--panel) 86%,transparent);box-shadow:var(--sh)}
main{gap:18px}
.panel{border-radius:var(--r);box-shadow:var(--sh)}
.board{padding:22px}
.board h2.bhd{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:18px}
.cnt{font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:1px 12px}
.cnt:empty{display:none}
.nav{border:0;gap:4px;background:color-mix(in srgb,var(--line) 45%,transparent);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.nav button{border:0;margin:0;border-radius:9px;padding:8px 20px;transition:background .15s,color .15s}
.nav button[aria-pressed=true]{background:var(--panel);color:var(--accent);box-shadow:var(--sh)}
.btn,input,select,textarea{border-radius:10px}
.btn{transition:transform .12s,border-color .15s,box-shadow .15s}.btn:active{transform:scale(.97)}
.btn.primary{flex:none;padding:9px 22px;box-shadow:0 6px 16px -8px var(--accent)}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));border-radius:12px;background:color-mix(in srgb,var(--c,var(--ink)) 4%,var(--panel));transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.kpi b{font-size:24px;display:inline}.kpi span{font-size:13px}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.rp-kpis .kpi{display:block;border-top:1px solid var(--line)}.rp-kpis .kpi:hover{transform:none;box-shadow:none}
.tools{padding:10px;background:color-mix(in srgb,var(--line) 28%,transparent);border-radius:12px;margin-bottom:16px}
.tools .search{flex:2 1 220px;max-width:none}
.tools select{flex:1 1 130px;background:var(--panel)}
.act-tools select{width:auto;min-width:150px}
.list{gap:12px}
.case{border-radius:12px;transition:transform .15s,box-shadow .15s}
.case:hover{transform:translateY(-2px);box-shadow:var(--sh)}.case.open,.case.open:hover{transform:none}
.rp-t{border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.board{padding:14px}.nav{width:100%}.nav button{flex:1;padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.logo{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:0 2px 8px -2px rgba(11,37,69,.45)}
.logo.big{width:68px;height:68px;border-radius:18px;display:block;margin:0 auto 14px}
.login-box{text-align:center}.login-box form,.login-box label,.login-box input{text-align:start}
.qrbox svg{width:210px;height:210px;border-radius:14px;box-shadow:var(--sh);display:block;margin:0 auto}
.qrcode{font:600 22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;margin:12px 0 4px;text-align:center}
#qrSt{text-align:center;min-height:1.4em}
</style>
</head>

function t(k, ...a){

function updateNotifBtn(){
  const b = $('notifBtn'); if(!b) return;
  if(!('Notification' in window)){ b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  const p = Notification.permission;
  b.textContent = t(p==='granted' ? 'nf_on' : p==='denied' ? 'nf_block' : 'nf_off');
  b.disabled = p !== 'default';
}
$('notifBtn').onclick = () => { try{ Notification.requestPermission().then(updateNotifBtn); }catch(e){} };
function clearUnseen(){ if(S.unseen){ S.unseen = 0; document.title = t('doc_title'); } }
window.addEventListener('focus', clearUnseen);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ clearUnseen(); if(S.me) refresh(true); } });
function beep(){
  try{
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)()); if(ac.state==='suspended') ac.resume();
    [880, 1175].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), st = ac.currentTime + i*0.18;
      o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.15, st); g.gain.exponentialRampToValueAtTime(0.001, st + 0.16);
      o.start(st); o.stop(st + 0.17);
    });
  }catch(e){}
}
// الكيسات المكتملة التي نبّهنا عنها (محفوظة بالمتصفح). أول تشغيل: نسجّل الموجود حالياً بدون إشعار.
function checkDone(cases){
  const done = cases.filter(c => !c.del && c.pub && kind(c)==='done');
  const ids = done.map(c => String(c.id));
  let seen = null; try{ seen = JSON.parse(store('fl_seen_done') || 'null'); }catch(e){}
  if(!Array.isArray(seen)){ store('fl_seen_done', JSON.stringify(ids)); return; }
  const set = new Set(seen);
  const fresh = done.filter(c => !set.has(String(c.id)));
  if(!fresh.length) return;
  store('fl_seen_done', JSON.stringify(Array.from(new Set(seen.concat(ids))).filter(id => cases.some(c => String(c.id) === id))));
  notifyDone(fresh);
}
function notifyDone(list){
  const names = list.map(c => c.t + (c.by ? ' – ' + c.by : '')).join(t('sep'));
  toast(t('done_n', list.length, names));
  beep();
  if(document.hidden || !document.hasFocus()){
    S.unseen += list.length; document.title = '(' + S.unseen + ') ' + t('doc_title');
  }
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      const n = new Notification(t('done_title'), { body: names, tag: 'fl-done', icon: '' });
      n.onclick = () => { window.focus(); S.filter = 'done'; render(); n.close(); };
    }
  }catch(e){}
}

/* ---- الاتصال بالسيرفر ---- */
function setOffline(f){ const b = $('offBar'); if(b) b.classList.toggle('hidden', !f); }
window.addEventListener('online', () => { if(S.me) refresh(true); });
async function api(body){
  const payload = JSON.stringify(Object.assign({wt:S.wt, dev:S.dev}, body));
  const safe = body.action==='login' || body.action==='pull' || (body.action==='sync' && !(body.cases && body.cases.length) && !body.purge && !body.actnames);
  let res = null, failed = false;
  for(let a = 0; a < (safe ? 2 : 1); a++){
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
    try{ const r = await fetch(URL_API, { method:'POST', body:payload, signal:ac.signal }); res = await r.json(); failed = false; break; }
    catch(e){ failed = true; }
    finally{ clearTimeout(tm); }
  }
  setOffline(failed);
  if(failed) throw new TypeError(t('e_conn'));
  if(res.wipe){ store('fl_wt', null); S.wt = ''; }
  if(!res.ok){ const e = new Error(res.msg || t('err')); e.auth = res.auth === false; throw e; }
  if(res.tok){ S.tok = res.tok; store('fl_tok', res.tok); }
  return res;
}
function mergeCases(res){
  if(!res.cases) return;
  res.cases.forEach(c => { const l = String(c.link||'').trim(); if(l && !/^https?:\/\//i.test(l)) c.link = /^www\./i.test(l) ? 'https://'+l : ''; });
  const mp = new Map(res.full ? [] : S.cases.map(c => [String(c.id), c]));
  res.cases.forEach(c => mp.set(String(c.id), c));
  (res.gone || []).forEach(id => mp.delete(String(id)));
  S.cases = Array.from(mp.values());
  try{ checkDone(S.cases); }catch(e){}
}
function absorb(res){
  mergeCases(res);
  if(res.users) S.users = res.users;
  render();
  if(S.screen==='activity') renderAct();
  renderReports();
}

async function absorbAll(res){

    let all = res.cases.slice(), nx = res.next;
    while(nx != null){ const p = await api({action:'pull', page:nx}); all = all.concat(p.cases || []); nx = p.next; }

}

function showLoginErr(){ $('loginErr').textContent = S.lerr ? (S.lerr.k ? t(S.lerr.k) : S.lerr.raw) : ''; }
/* مولّد QR صغير (نسخة 1، مستوى تصحيح L، حتى 17 بايت) */
function qrMatrix(txt){
  const N = 21, d = Array.from(txt, c => c.charCodeAt(0) & 255);
  if(d.length > 17) throw new Error('qr too long');
  const b = [], put = (v,n) => { for(let i = n-1; i >= 0; i--) b.push((v >> i) & 1); };
  put(4,4); put(d.length,8); d.forEach(x => put(x,8)); put(0, Math.min(4, 152 - b.length));
  while(b.length % 8) b.push(0);
  const cw = []; for(let i = 0; i < b.length; i += 8) cw.push(parseInt(b.slice(i,i+8).join(''), 2));
  for(let p = 0xEC; cw.length < 19; p = p === 0xEC ? 0x11 : 0xEC) cw.push(p);
  const ex = [], lg = []; let x = 1;
  for(let i = 0; i < 255; i++){ ex[i] = x; lg[x] = i; x <<= 1; if(x & 256) x ^= 0x11D; }
  const mul = (a,c) => a && c ? ex[(lg[a] + lg[c]) % 255] : 0;
  let g = [1];
  for(let i = 0; i < 7; i++){ const n = Array(g.length+1).fill(0); g.forEach((c,j) => { n[j] ^= c; n[j+1] ^= mul(c, ex[i]); }); g = n; }
  const ec = Array(7).fill(0);
  cw.forEach(c => { const f = c ^ ec[0]; ec.shift(); ec.push(0); if(f) g.slice(1).forEach((gc,j) => { ec[j] ^= mul(gc,f); }); });
  const bits = []; cw.concat(ec).forEach(c => { for(let i = 7; i >= 0; i--) bits.push((c >> i) & 1); });
  const m = Array.from({length:N}, () => Array(N).fill(null));
  const set = (r,c,v) => { if(r >= 0 && r < N && c >= 0 && c < N) m[r][c] = v; };
  const finder = (r,c) => { for(let i = -1; i <= 7; i++) for(let j = -1; j <= 7; j++){
    const on = i >= 0 && i <= 6 && j >= 0 && j <= 6 && (i == 0 || i == 6 || j == 0 || j == 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4)); set(r+i, c+j, on); } };
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for(let i = 8; i < N-8; i++){ set(6,i,i % 2 == 0); set(i,6,i % 2 == 0); }
  m[N-8][8] = true;
  for(let i = 0; i < 9; i++){ if(m[8][i] === null) m[8][i] = false; if(m[i][8] === null) m[i][8] = false; }
  for(let i = 0; i < 8; i++){ if(m[8][N-1-i] === null) m[8][N-1-i] = false; if(m[N-1-i][8] === null) m[N-1-i][8] = false; }
  let k = 0, up = true;
  for(let c = N-1; c > 0; c -= 2){ if(c == 6) c--;
    for(let t = 0; t < N; t++){ const r = up ? N-1-t : t;
      for(let j = 0; j < 2; j++){ const cc = c - j;
        if(m[r][cc] === null){ const bit = k < bits.length ? bits[k++] : 0; m[r][cc] = (r + cc) % 2 == 0 ? !bit : !!bit; } } }
    up = !up; }
  let f = 8 << 10; for(let i = 14; i >= 10; i--) if((f >> i) & 1) f ^= 0x537 << (i - 10);
  const fmt = ((8 << 10) | f) ^ 0x5412, gb = i => ((fmt >> i) & 1) == 1;
  for(let i = 0; i < 6; i++) m[i][8] = gb(i);
  m[7][8] = gb(6); m[8][8] = gb(7); m[8][7] = gb(8);
  for(let i = 9; i < 15; i++) m[8][14-i] = gb(i);
  for(let i = 0; i < 8; i++) m[8][N-1-i] = gb(i);
  for(let i = 8; i < 15; i++) m[N-15+i][8] = gb(i);
  m[N-8][8] = true;
  return m;
}
function qrSvg(txt){
  const m = qrMatrix(txt), N = m.length, q = 3; let p = '';
  m.forEach((row,r) => row.forEach((v,c) => { if(v) p += 'M' + (c+q) + ' ' + (r+q) + 'h1v1h-1z'; }));
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (N+2*q) + ' ' + (N+2*q) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + p + '" fill="#0B2545"/></svg>';
}

/* ---- دخول بربط الجهاز (QR): المتصفح ما يعرف كود الحساب أبداً ---- */
const IDLE_MIN = 60;                      // خمول بالدقائق ثم يطلع تلقائياً
let qrT = 0, qrGen = 0, idleT = 0;
function loginErr(e){
  const m = e.message || '';
  S.lerr = e.k ? {k:e.k} : /Login failed/i.test(m) ? {k:'e_generic'} : /Too many attempts/i.test(m) ? {k:'e_busy'} : (e instanceof TypeError) ? {k:'e_conn'} : {raw:m};
  showLoginErr();
}
async function login(){
  const res = await api({action:'login'});
  if(res.user.role !== 'admin'){ const e = new Error('not admin'); e.k = 'e_notadmin'; throw e; }
  S.me = res.user; S.users = res.users || [];
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); showScreen(S.screen);
  $('who').textContent = res.user.name;

  clearInterval(login.timer);
  login.timer = setInterval(()=>refresh(true), 30000);       // حتى لو التبويب بالخلفية حتى توصل الإشعارات
  armIdle();
}
function armIdle(){ clearTimeout(idleT); idleT = setTimeout(() => { if(S.me) logout(); }, IDLE_MIN*60000); }
['click','keydown','pointerdown','scroll'].forEach(ev => document.addEventListener(ev, () => { if(S.me) armIdle(); }, {passive:true}));
function logout(){
  clearInterval(login.timer); clearTimeout(idleT);
  ['fl_wt','fl_draft','fl_code','fl_tok'].forEach(k => store(k, null));
  S.wt = ''; S.me = null; S.cases = []; S.since = 0; S.vk = '';
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  qrStart();
}
async function qrStart(){
  clearTimeout(qrT); const my = ++qrGen; S.lerr = null; showLoginErr();
  const sec = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2,'0')).join('');
  const ua0 = navigator.userAgent, br = /Edg\//.test(ua0) ? 'Edge' : /Firefox\//.test(ua0) ? 'Firefox' : /Chrome\//.test(ua0) ? 'Chrome' : /Safari\//.test(ua0) ? 'Safari' : 'Browser';
  const ua = ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '') + ' · ' + br;
  let r;
  try{ r = await api({action:'qr_new', sec, ua}); }
  catch(e){ if(my === qrGen){ $('qrSt').textContent = t('e_conn'); qrT = setTimeout(qrStart, 5000); } return; }
  if(my !== qrGen) return;
  $('qrBox').innerHTML = qrSvg('FL:' + r.id); $('qrCode').textContent = r.id.slice(0,4) + '-' + r.id.slice(4);
  $('qrSt').textContent = t('qr_wait');
  const t0 = Date.now();
  const poll = async () => {
    if(my !== qrGen || S.me) return;
    if(Date.now() - t0 > (r.ttl || 120)*1000) return qrStart();
    try{
      const pr = await api({action:'qr_poll', id:r.id, sec});
      if(my !== qrGen) return;
      if(pr.st === 'ok'){ S.wt = pr.wt; store('fl_wt', pr.wt); try{ await login(); }catch(e){ S.wt = ''; store('fl_wt', null); loginErr(e); qrStart(); } return; }
      if(pr.st === 'gone') return qrStart();
    }catch(e){}
    qrT = setTimeout(poll, 2000);
  };
  qrT = setTimeout(poll, 2000);
}

function dur(ms){
  ms = Math.max(0, ms); const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sc = s%60;
  const u = S.lang==='ar' ? ['يوم','ساعة','دقيقة','ثانية'] : ['d','h','m','s'], p = [];
  if(d) p.push(d+' '+u[0]);

async function copyToClipboard(text, html){
  try{
    if(html && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/plain': new Blob([text], {type:'text/plain'}),
        'text/html': new Blob([html], {type:'text/html'})
      })]);
      return true;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{                                         // احتياط للمتصفحات/الصفحات غير الآمنة
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---- رقم موبايل صالح: 10 أو 11 خانة فقط (يرفض IMSI وأي رقم آخر) ---- */
function cleanPhone(v){
  const d = String(v||'')
    .replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 0x0660)
    .replace(/[\u06F0-\u06F9]/g, c => c.charCodeAt(0) - 0x06F0)
    .replace(/[\s\-().+]/g, '')
    .replace(/^(00)?964(?=\d{10}$)/, '');
  if(!/^\d{10,11}$/.test(d)) return '';
  return d.length === 10 ? '0' + d : d;      // نضيف 0 في البداية إذا الرقم 10 خانات
}

const govKey = x => String(x||'').toLowerCase().replace(/[^a-z]/g,'');
const KNOWN_GOV = new Set(['baghdad','mosul','nineveh','ninawa','kirkuk','tamim','taamim','tameem','tamin','basra','basrah','erbil','arbil','sulaymaniyah','sulaimaniyah','slemani','duhok','dohuk','anbar','babylon','babil','karbala','najaf','diwaniyah','qadisiyah','wasit','maysan','missan','dhiqar','thiqar','muthanna','salahaldin','salahuddin','saladin','diyala']);
function parseEmail(text){
  const rows = text.replace(/\r/g,'').split('\n').map(l => l.split('\t').map(x => x.trim().replace(/^"|"$/g,''))).filter(r => r.some(x => x));
  if(!rows.length) return [];
  const low = rows[0].map(h => h.toLowerCase());
  const hasHead = low.some(h => /governorate|msisdn|address|remedy/.test(h)) && !rows[0].some(x => /^CS\d{6,}$/i.test(x));
  const col = re => hasHead ? low.findIndex(h => re.test(h)) : -1;
  const ix = { ref:col(/remedy|^ref/), gov:col(/governorate/), addr:col(/address/), ms:col(/msisdn/), cb:col(/call ?back/),
               tech:col(/technology/), cell:col(/cell/), dept:col(/department/), start:col(/start/) };
  const body = hasHead ? rows.slice(1) : rows;
  return body.map(r => {
    const get = i => i >= 0 ? (r[i] || '') : '';
    let tk = r.find(x => /^CMC\w+$/i.test(x)) || r.find(x => /^CS\d{6,}$/i.test(x)) || get(ix.ref);
    tk = cleanTicket(tk);
    let gov = get(ix.gov), addr = get(ix.addr), ms = cleanPhone(get(ix.ms)), cb = cleanPhone(get(ix.cb));
    if(!hasHead){
      const DEPT_RE = /direct|indirect|sales|marketing|b2b|enterprise|retail|consumer|corporate|care|wholesale|vip|reopen|cmc/i;
      gov = r.find(x => KNOWN_GOV.has(govKey(x))) ||
            r.find(x => /^[A-Za-z][A-Za-z .\-]{2,20}$/.test(x) && !DEPT_RE.test(x) && !/south|north|middle|data|voice|ref|^\d/i.test(x)) || '';
      const ar = r.filter(x => /[\u0600-\u06FF]/.test(x)); addr = (ar.length ? ar : r.filter(x => !/^CS\d/i.test(x) && x !== gov)).sort((a,b) => b.length - a.length)[0] || '';
      const ph = r.map(cleanPhone).filter(Boolean); ms = ph[0] || ''; cb = ph[1] || '';
    }
    const dupe = S.cases.some(c => !c.del && String(c.t).toUpperCase() === String(tk).toUpperCase());
    return { t:tk, gov:'', egov:gov, asg:'', addr, name:'', ms, cb, dept:normDept(hasHead ? get(ix.dept) : (r.find(x => /^(direct|indirect|marketing|b2b|enterprise|retail|consumer|corporate|care|wholesale)/i.test(x) || /^(vip|reopen|cmc|fcmc|sales)$/i.test(x) || /need[\s_\-.]*dt/i.test(x)) || '')) || deriveDept(tk), tech:get(ix.tech), cell:get(ix.cell), start:get(ix.start), dupe, urg:false, sel: !dupe && !!tk };
  }).filter(i => i.t || i.addr).map((i,n,a) => { if(i.t && a.findIndex(x => String(x.t).toUpperCase() === i.t.toUpperCase()) < n){ i.dupe = true; i.sel = false; } return i; });
}

    { name:'xl/styles.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ${NS}><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF8EA9DB"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFF0000"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>` },
    { name:'xl/worksheets/sheet1.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData></worksheet>` }
  ];
  const blob = zipStore(files);
  if(asBlob) return blob;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const actDay = () => $('actDate').value || todayStr();
$('actEmail').value = store('fl_act_email') || '';
$('actEmail').addEventListener('input', () => store('fl_act_email', $('actEmail').value.trim()));
function joinEn(a){ return a.length < 3 ? a.join(' and ') : a.slice(0,-1).join(', ') + ', and ' + a[a.length-1]; }
function actGovText(){
  const g = mgrGovList().map(x => CITY_MAP[normGov(x)] || x);
  return joinEn(g.length ? g : [...new Set((S.actList||[]).flatMap(e => e.rows.map(r => r.v[2])).filter(Boolean))]);
}
function actDateText(){ const [y,m,d] = actDay().split('-').map(Number); return String(d).padStart(2,'0') + '-' + MON[m-1] + '-' + y; }
function b64(u8){ let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/.{76}/g, '$&\r\n'); }
$('actMail').onclick = async () => {
  const em = $('actEmail').value.trim();
  if(!/^[^\s@]+@[^\s@]+$/.test(em)){ toast(t('act_email_need')); $('actEmail').focus(); return; }
  if(!S.actList || !S.actList.length) return;
  const btn = $('actMail'); btn.disabled = true;
  try{
    const fname = 'Activity_' + actDay() + '.xlsx';
    const xl = new Uint8Array(await exportAct(S.actList, fname, true).arrayBuffer());
    const tag = '<a href="mailto:' + esc(em) + '" style="background-color:#dce6f5;color:#0f6cbd;text-decoration:none;border-radius:3px;padding:0 3px">@' + esc(em) + '</a>';
    const html = '<html><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt"><p>Dear ' + tag + ',</p><p>Please find the attached file for the activity dated ' + esc(actDateText()) + ' covering ' + esc(actGovText()) + '.</p></body></html>';
    const bd = 'FLb' + Date.now().toString(36);
    const eml = ['X-Unsent: 1', 'To: ' + em, 'Subject: ' + fname, 'MIME-Version: 1.0', 'Content-Type: multipart/mixed; boundary="' + bd + '"', '',
      '--' + bd, 'Content-Type: text/html; charset="utf-8"', 'Content-Transfer-Encoding: base64', '', b64(new TextEncoder().encode(html)),
      '--' + bd, 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet; name="' + fname + '"', 'Content-Transfer-Encoding: base64', 'Content-Disposition: attachment; filename="' + fname + '"', '', b64(xl),
      '--' + bd + '--', ''].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([eml], { type:'message/rfc822' })); a.download = 'Activity_' + actDay() + '.eml'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(t('act_mail_hint'));
  }finally{ btn.disabled = false; }
};
$('actXlsAll').onclick = () => { if(S.actList && S.actList.length) exportAct(S.actList, 'Activity_' + actDay() + '.xlsx'); };
$('actAll').onclick = () => { if(S.actList && S.actList.length) copyAct(S.actList, t('act_copied_all')); };
async function editActName(u){
  const v = prompt(t('act_name_prompt', u.name), u.act || '');
  if(v === null) return;
  const val = v.trim();
  try{
    await push({ actnames: { [u.id]: val } });
    const nu = S.users.find(x => String(x.id) === String(u.id));
    toast(t(nu && (nu.act || '') === val ? 'act_name_saved' : 'act_name_nosave'));
  }catch(e){ if(e.auth) return logout(); toast(t('send_fail', e.message)); }
}
$('actBody').addEventListener('click', e => {
  const b = e.target.closest('[data-uid],[data-xid],[data-eid]'); if(!b) return;
  const id = b.dataset.uid || b.dataset.xid || b.dataset.eid;
  const en = (S.actList||[]).find(x => String(x.u.id) === id);
  if(!en) return;
  if(b.dataset.eid){ editActName(en.u); return; }
  if(b.dataset.xid) exportAct([en], 'Activity_' + en.u.name.replace(/[\\/:*?"<>|]/g,'').trim() + '_' + actDay() + '.xlsx');
  else copyAct([en], t('act_copied_one', en.u.name));
});

/* ---- بدء التشغيل ---- */
(function init(){
  applyLang();
  let d = store('fl_dev');
  if(!d){ d = 'web-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); store('fl_dev', d); }
  S.dev = d;
  S.wt = store('fl_wt') || '';
  if(S.wt) login().catch(() => { S.wt = ''; store('fl_wt', null); qrStart(); }); else qrStart();
})();
</script>
